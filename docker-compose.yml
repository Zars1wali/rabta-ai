services:
  nuncio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuncio-platform
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - META_APP_ID=1584644373301704
      - META_APP_SECRET=${META_APP_SECRET:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/nuncio_db}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: nuncio-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: nuncio_db
    ports:
      - "5432:5432"
    volumes:
      - nuncio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nuncio_pgdata:
